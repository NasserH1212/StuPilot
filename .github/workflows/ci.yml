name: Sprint 0 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: studenthub_test
          POSTGRES_USER: studenthub_test
          POSTGRES_PASSWORD: local-only-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studenthub_test -d studenthub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NEXT_PUBLIC_APP_ENV: test
      TEST_DATABASE_URL: postgresql://studenthub_test:local-only-ci@127.0.0.1:5432/studenthub_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Clean dependency install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check architecture boundaries
        run: npm run boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run component tests
        run: npm run test:component

      - name: Run component accessibility checks
        run: npm run test:a11y

      - name: Scan repository for committed secrets
        run: npm run secrets:scan

      - name: Audit production dependencies
        run: npm run audit

      - name: Apply reviewed migrations to isolated PostgreSQL
        run: npm run db:test:migrate

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility smoke tests
        run: npm run test:e2e
