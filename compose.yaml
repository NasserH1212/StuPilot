name: studenthub-ai-local

services:
  postgres-dev:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: studenthub_dev
      POSTGRES_USER: studenthub_dev
      POSTGRES_PASSWORD: local-only-dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studenthub_dev -d studenthub_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - studenthub-postgres-dev:/var/lib/postgresql/data

  postgres-test:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: studenthub_test
      POSTGRES_USER: studenthub_test
      POSTGRES_PASSWORD: local-only-test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studenthub_test -d studenthub_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  studenthub-postgres-dev:
